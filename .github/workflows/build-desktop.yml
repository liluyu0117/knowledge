name: 桌面端构建

# 触发方式：
#   1) 打 tag（v0.1.0）→ 自动构建并发布 Release
#   2) 推送到 main 且改动了 desktop/server/web → 只构建，产物留在 Actions 里下载
#   3) 手动运行（Actions 页面 Run workflow），可指定版本号
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0，留空沿用 desktop/package.json）'
        required: false
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write   # 发布 Release 需要

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: 准备 JDK 17（Microsoft，匹配 pom 的 toolchain 约束）
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: maven

      - name: 生成 Maven toolchains.xml
        shell: pwsh
        run: |
          # pom 的 maven-toolchains-plugin 要求 jdk vendor=microsoft version=17，
          # 必须显式声明 vendor，否则报「No toolchain matched」。
          $dir = Join-Path $env:USERPROFILE '.m2'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $jdk = $env:JAVA_HOME
          $xml = @"
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>microsoft</vendor>
              </provides>
              <configuration>
                <jdkHome>$jdk</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          "@
          Set-Content (Join-Path $dir 'toolchains.xml') $xml -Encoding utf8
          Write-Host "toolchains.xml -> $jdk"

      - name: 确定版本号
        shell: pwsh
        run: |
          $ver = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ('${{ github.event.inputs.version }}') {
            $ver = '${{ github.event.inputs.version }}'
          }
          if ($ver) {
            node -e "const fs=require('fs');const p='desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$ver';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
            Write-Host "版本号已设为 $ver"
          } else {
            Write-Host "沿用 package.json 中的版本号"
          }
          node -p "'打包版本: ' + require('./desktop/package.json').version"

      - name: 构建前端（产物进 server 静态资源）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 配置 Maven 镜像（加速依赖下载）
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.m2'
          New-Item -ItemType Directory -Force $dir | Out-Null
          @'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Public</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          '@ | Set-Content (Join-Path $dir 'settings.xml') -Encoding utf8
          Write-Host "settings.xml 已写入 $dir"

      - name: 构建后端可执行 jar
        working-directory: server
        run: |
          mvn -B -e -DskipTests package 2>&1 | Tee-Object -FilePath ../mvn-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 准备桌面端资源
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/resources | Out-Null
          Copy-Item server/target/kb-server-0.1.0.jar desktop/resources/kb.jar -Force
          Get-Item desktop/resources/kb.jar | ForEach-Object { "kb.jar: {0:N1} MB" -f ($_.Length / 1MB) }

      - name: 生成裁剪版 Java 运行时（jlink）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop/scripts/build-runtime.ps1

      - name: 安装桌面端依赖
        working-directory: desktop
        # 用 install 而非 ci：该工程的 lock 由本机生成（部分包为手工补齐），
        # npm ci 会因个别条目缺失直接失败；install 能自动校正。
        run: npm install --no-audit --no-fund

      - name: 打包（NSIS 安装包）
        working-directory: desktop
        run: node scripts/pack.mjs --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 无签名证书，跳过签名探测

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem desktop/dist -Filter *.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: 上传构建产物（所有分支）
        uses: actions/upload-artifact@v4
        with:
          name: 两翼知识库-桌面端-${{ github.run_number }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          retention-days: 14
          if-no-files-found: error

      - name: 输出后端构建错误（失败时）
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path 'mvn-build.log') {
            Get-Content 'mvn-build.log' | Select-String -Pattern '\[ERROR\]' | Select-Object -First 15 |
              ForEach-Object { Write-Host "::error::$($_.Line)" }
          } else {
            Write-Host "::error::mvn-build.log 未生成，mvn 可能未启动"
          }

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            mvn-build.log
            desktop/dist/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: 移除 Release 中多余的绿色版资产
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $names = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          foreach ($n in $names) {
            if ($n -match '绿色版') {
              gh release delete-asset $tag $n --yes 2>$null
              Write-Host "已移除资产: $n"
            }
          }
          Write-Host "Release 资产已清理"
