name: 桌面端构建

# 触发方式：
#   1) 打 tag（v0.1.0）→ 自动构建并发布 Release
#   2) 推送到 main 且改动了 desktop/server/web → 只构建，产物留在 Actions 里下载
#   3) 手动运行（Actions 页面 Run workflow），可指定版本号
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0，留空沿用 desktop/package.json）'
        required: false
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write   # 发布 Release 需要

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 确定版本号
        shell: pwsh
        run: |
          $ver = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ('${{ github.event.inputs.version }}') {
            $ver = '${{ github.event.inputs.version }}'
          }
          if ($ver) {
            node -e "const fs=require('fs');const p='desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$ver';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
            Write-Host "版本号已设为 $ver"
          } else {
            Write-Host "沿用 package.json 中的版本号"
          }
          node -p "'打包版本: ' + require('./desktop/package.json').version"

      - name: 构建前端（产物进 server 静态资源）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 构建后端可执行 jar
        working-directory: server
        run: mvn -B -DskipTests package

      - name: 准备桌面端资源
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/resources | Out-Null
          Copy-Item server/target/kb-server-0.1.0.jar desktop/resources/kb.jar -Force
          Get-Item desktop/resources/kb.jar | ForEach-Object { "kb.jar: {0:N1} MB" -f ($_.Length / 1MB) }

      - name: 生成裁剪版 Java 运行时（jlink）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop/scripts/build-runtime.ps1

      - name: 安装桌面端依赖
        working-directory: desktop
        # 用 install 而非 ci：该工程的 lock 由本机生成（部分包为手工补齐），
        # npm ci 会因个别条目缺失直接失败；install 能自动校正。
        run: npm install --no-audit --no-fund

      - name: 打包（安装包 + 绿色版单文件）
        working-directory: desktop
        run: node scripts/pack.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 无签名证书，跳过签名探测

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem desktop/dist -Filter *.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: 上传构建产物（所有分支）
        uses: actions/upload-artifact@v4
        with:
          name: 两翼知识库-桌面端-${{ github.run_number }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          retention-days: 14
          if-no-files-found: error

      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
